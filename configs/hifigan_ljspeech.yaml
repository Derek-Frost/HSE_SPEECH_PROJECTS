seed: 42
device: cuda

data:
  root: W:/SPEECH/hifigan_project/LJSpeech-1.1
  batch_size: 4
  num_workers: 0
  segment_size: 8192

audio:
  sample_rate: 22050
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 80
  fmin: 0
  fmax: 8000

model:
  channels: 512
  upsample_rates: [8, 8, 2, 2]
  upsample_kernels: [16, 16, 4, 4]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilations:
    - [1, 3, 5]
    - [1, 3, 5]
    - [1, 3, 5]

train:
  epochs: 21
  lr_g: 0.0002
  lr_d: 0.0002
  betas: [0.8, 0.99]
  lambda_fm: 2.0
  lambda_mel: 45.0
  checkpoint_dir: checkpoints/hifigan_ljspeech
